[package]
name = "browser-picker"
version = "0.1.0"
edition = "2021"
description = "A tiny, native browser picker for Windows — choose which browser opens each link."
license = "MIT"
repository = "https://github.com/Soneji/browser-picker"

[[bin]]
name = "browser-picker"
path = "src/main.rs"

# All runtime deps are Windows-only. Build with:
#   cargo build --release --target x86_64-pc-windows-msvc   (CI / real binary)
#   cargo check  --target x86_64-pc-windows-gnu             (local type-check on Linux)
[target.'cfg(windows)'.dependencies]
nwg = { package = "native-windows-gui", version = "1.0.13" }
winreg = "0.52"
winapi = { version = "0.3.9", features = ["winuser"] }

[build-dependencies]
embed-manifest = "1.4.0"

[profile.release]
opt-level = "z"     # optimize for size
lto = true
codegen-units = 1
panic = "abort"
strip = true
