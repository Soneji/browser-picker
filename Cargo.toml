[package]
name = "browser-picker"
version = "0.5.0"
edition = "2021"
description = "A tiny, native browser picker for Windows — choose which browser opens each link."
license = "MIT"
repository = "https://github.com/Soneji/browser-picker"

[[bin]]
name = "browser-picker"
path = "src/main.rs"

# Windows-only deps. Build with:
#   cargo build --release --target x86_64-pc-windows-msvc   (CI / real binary)
#   cargo check  --target x86_64-pc-windows-gnu             (local type-check on Linux)
[target.'cfg(windows)'.dependencies]
# No GPU: the UI is drawn directly with GDI (double-buffered) via winapi, so it
# works on any Windows — including RDP sessions and VMs with no graphics adapter.
winreg = "0.52"
winapi = { version = "0.3.9", features = ["winuser", "wingdi", "libloaderapi", "dwmapi", "shellapi"] }

[profile.release]
opt-level = "z"     # optimize for size
lto = true
codegen-units = 1
strip = true
