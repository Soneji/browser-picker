[package]
name = "browser-picker"
version = "0.2.0"
edition = "2021"
description = "A tiny, native browser picker for Windows — choose which browser opens each link."
license = "MIT"
repository = "https://github.com/Soneji/browser-picker"

[[bin]]
name = "browser-picker"
path = "src/main.rs"

# Windows-only deps. Build with:
#   cargo build --release --target x86_64-pc-windows-msvc   (CI / real binary)
#   cargo check  --target x86_64-pc-windows-gnu             (local type-check on Linux)
[target.'cfg(windows)'.dependencies]
# egui/eframe give a modern, flat, GPU-rendered UI (glow/OpenGL backend). No
# accesskit / x11 / wayland (Windows-only), keeping the dep tree lean.
eframe = { version = "0.29", default-features = false, features = ["glow", "default_fonts"] }
egui = "0.29"
winreg = "0.52"
winapi = { version = "0.3.9", features = ["winuser"] }

[profile.release]
opt-level = "z"     # optimize for size
lto = true
codegen-units = 1
strip = true
