name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Build (release)
        run: cargo build --release --locked

      - name: Stage binary
        shell: pwsh
        run: Copy-Item target\release\browser-picker.exe browser-picker.exe

      - name: Report size
        shell: pwsh
        run: Write-Host ("browser-picker.exe = {0:N0} bytes" -f (Get-Item browser-picker.exe).Length)

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        run: |
          $ver = "0.0.0-dev"
          if ($env:GITHUB_REF -like "refs/tags/v*") { $ver = $env:GITHUB_REF_NAME.TrimStart("v") }
          Write-Host "Installer version: $ver"
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$ver" installer\browser-picker.iss
          Write-Host ("browser-picker-setup.exe = {0:N0} bytes" -f (Get-Item installer\browser-picker-setup.exe).Length)

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: browser-picker-windows-x64
          path: |
            browser-picker.exe
            installer/browser-picker-setup.exe

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            browser-picker.exe
            installer/browser-picker-setup.exe
          generate_release_notes: true
